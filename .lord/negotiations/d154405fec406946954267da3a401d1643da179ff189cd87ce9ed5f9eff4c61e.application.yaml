version: "0.3"
kind: application_negotiation
negotiation_id: sha256:d154405fec406946954267da3a401d1643da179ff189cd87ce9ed5f9eff4c61e
source_contract_id: sha256:2bd8d79332dc900aa6d84172624104c006fecf4aaaeffb750c1d676bdbb9eee2
request: "El catálogo de promociones debe persistir en disco y sobrevivir reinicios y caídas del servicio. Hoy la entidad Promotion declara storage: memory y un reinicio borra el catálogo completo. El cambio pasa la entidad a almacenamiento persistente sin alterar entidades, campos, operaciones, políticas ni flujos existentes."
requested_by: marianoceneri
created_at: 2026-08-11T15:56:19.226Z
questions:
  - question_id: AQ-STORAGE-BACKEND
    question: ¿Alcanza SQLite embebido (un archivo local en el nodo, con un único proceso escritor) como persistencia del catálogo, o el catálogo debe vivir en una base de datos en red compartida por varias instancias del servicio?
    alternatives:
      - choice: 1
        answer: SQLite embebido en archivo local
        consequence: "Expresable en el contrato de aplicación con storage: sqlite y target.database. LORD genera el esquema desde los campos de la entidad, abre el archivo al arrancar y aplica migraciones aditivas automáticas. Los datos sobreviven reinicios y caídas. Restringe el despliegue a un solo proceso escritor sobre un volumen persistente: no habilita varias instancias del servicio compartiendo catálogo, ni alta disponibilidad."
      - choice: 2
        answer: Base de datos en red compartida (por ejemplo PostgreSQL o MySQL)
        consequence: "No es expresable en el contrato de aplicación: el esquema de LORD 0.2 solo admite storage memory o sqlite. Es una limitación del motor, no del contrato. Cumplirlo exigiría código de persistencia fuera del flujo generado, lo que rompe la autoridad del contrato sobre el comportamiento del catálogo. Requiere una decisión explícita sobre cómo se gobierna ese código no generado."
  - question_id: AQ-DATABASE-PATH
    question: ¿Qué ruta de archivo debe declarar el contrato como ubicación por defecto de la base de datos? En ambos casos la ruta es sobrescribible en despliegue con la variable de entorno LORD_DATABASE_PATH.
    alternatives:
      - choice: 1
        answer: "Ruta relativa al proceso: ./data/promotions.db"
        consequence: "Arranque simple en desarrollo y en contenedor sin permisos especiales. La supervivencia a reinicios depende de que el volumen persistente se monte exactamente en ese directorio de trabajo: si el proceso arranca con otro working directory o sin volumen, se crea una base vacía en silencio y el catálogo se pierde igual que hoy."
      - choice: 2
        answer: "Ruta absoluta de sistema: /var/lib/promo-api/promotions.db"
        consequence: Ubicación independiente del working directory, alineada con la convención de despliegue y con las rutinas de backup del sistema. Exige que el directorio exista y que el usuario del servicio tenga permiso de escritura antes del arranque; en desarrollo local obliga a exportar LORD_DATABASE_PATH.
decisions:
  - question_id: AQ-STORAGE-BACKEND
    revision: 1
    choice: 1
    decided_by: "marianoceneri (delegado autorizado: Claude, ensayo 5)"
    rationale: "SQLite embebido en archivo local: cumple el requisito de negocio (sobrevivir reinicios y caídas) manteniendo el catálogo bajo la autoridad del contrato. La restricción de un único proceso escritor es aceptable para el despliegue actual. La base en red queda como evolución futura del motor (limitación declarada, no una decisión de negocio en contra)."
    decided_at: 2026-08-11T15:58:08.707Z
  - question_id: AQ-DATABASE-PATH
    revision: 1
    choice: 1
    decided_by: "marianoceneri (delegado autorizado: Claude, ensayo 5)"
    rationale: Ruta relativa ./data/promotions.db como default del contrato, sobrescribible con LORD_DATABASE_PATH en despliegue. Mantiene el laboratorio autocontenido.
    decided_at: 2026-08-11T15:58:08.712Z

request: "Reapertura contra el contrato activo sha256:1d64b247… de la negociación de bajas sha256:4ea98209… (obsoleta tras e583a5f). Conserva las 4 decisiones originales y agrega las 2 interacciones declaradas por el agente en el ensayo 3: rehabilitación de promociones vencidas y bypass del canal genérico de escritura sobre enabled."
requested_by: "marianoceneri (delegado autorizado: Claude, ensayo 3)"
created_at: 2026-08-11T14:50:57.571Z
questions:
  - question_id: AQ-BAJA-NATURALEZA
    question: ¿Qué significa dar de baja una promoción en el catálogo?
    alternatives:
      - choice: 1
        answer: "Baja lógica: permanece en el catálogo con enabled=false y sigue consultable."
        consequence: Transición dedicada enabled true→false; la historia se conserva.
      - choice: 2
        answer: "Baja física: se elimina del catálogo."
        consequence: Operación de borrado; las consultas posteriores pierden sujeto.
  - question_id: AQ-BAJA-REALTA
    question: Una vez dada de baja, ¿puede rehabilitarse la misma promoción?
    alternatives:
      - choice: 1
        answer: "No: la baja es definitiva."
        consequence: El evento de baja es único por promoción.
      - choice: 2
        answer: "Sí: mediante una operación dedicada de rehabilitación."
        consequence: Segunda transición false→true con evento propio; baja y rehabilitación alternan.
  - question_id: AQ-BAJA-EFECTO
    question: ¿Qué operaciones quedan prohibidas sobre una promoción dada de baja?
    alternatives:
      - choice: 1
        answer: Ninguna.
        consequence: Sin guardas de estado.
      - choice: 2
        answer: No puede modificarse; sí consultarse y evaluarse.
        consequence: state_guard en UpdatePromotion y regla operacional.
      - choice: 3
        answer: No puede modificarse ni evaluarse su vigencia; solo consultarse.
        consequence: state_guard en UpdatePromotion y CheckPromotionValidity; la evaluación de vigencia pasa de responder 'no vigente' a rechazarse con 409, cambio observable para el equipo autorizador.
  - question_id: AQ-BAJA-VISIBILIDAD
    question: ¿Cómo aparecen las promociones dadas de baja en el listado?
    alternatives:
      - choice: 1
        answer: Se listan junto con las activas.
        consequence: ListPromotions no cambia.
      - choice: 2
        answer: El listado debe poder filtrarse por estado.
        consequence: Parámetro de consulta booleano tipado sobre enabled.
  - question_id: AQ-BAJA-BYPASS
    question: ¿La modificación genérica (UpdatePromotion) puede seguir escribiendo enabled directamente?
    alternatives:
      - choice: 1
        answer: "No: solo las transiciones dedicadas cambian el estado."
        consequence: enabled pasa a immutable para el PUT; toda baja/rehabilitación emite su evento y las reglas CR-006/007/008 conservan sujeto.
      - choice: 2
        answer: "Sí: el PUT también puede cambiar el estado."
        consequence: Una baja por PUT no emite PromocionDadaDeBaja y las garantías ratificadas son eludibles.
  - question_id: AQ-BAJA-VENCIDA
    question: ¿La rehabilitación de una promoción con ends_at ya vencido debe rechazarse, en línea con la regla activa de vencimiento?
    alternatives:
      - choice: 1
        answer: "Sí: EnablePromotion lleva la misma precondición temporal que Create/Update."
        consequence: Ningún camino de escritura puede dejar enabled=true con vigencia vencida.
      - choice: 2
        answer: "No: la rehabilitación queda exenta."
        consequence: La regla de vencimiento aprobada en e583a5f queda eludible por la vía nueva.

version: "0.2"
kind: application_contract
status: proposal
proposal_id: sha256:320edd7e0c79544ebce5e2605d41a7f436c38542213a36a675c95be400f2afee
source_contract_id: sha256:059375c5c3c9d4796de53d3d17778be4ad9071f00c8bd2ab6b015f7350bb039b
proposed_contract_id: sha256:bbdd4111b650fd48fbb3d2b7ea24b6299de2cfd0fb3baa7a5c16bdd460bf9d69
proposed_by: codex
rationale: Emit structured runtime events with promotion_id so correlated operational rules are verifiable.
created_at: 2026-08-09T23:30:42.738Z
impact:
  entities_added: []
  entities_removed: []
  entities_modified: []
  operations_added: []
  operations_removed: []
  operations_modified:
    - CheckPromotionValidity
    - CreatePromotion
    - GetPromotion
    - UpdatePromotion
  policies_added: []
  policies_removed: []
  flows_added: []
  flows_removed: []
contract:
  version: "0.2"
  name: promo-api
  target:
    kind: go-rest
    module: github.com/marianoceneri/promo-api
    port: 8080
  entities:
    - name: Promotion
      title: promoción
      plural: promotions
      id_field: id
      storage: memory
      fields:
        - name: id
          type: string
          required: true
          immutable: true
        - name: name
          type: string
          required: true
          immutable: false
        - name: starts_at
          type: datetime
          required: true
          immutable: false
        - name: ends_at
          type: datetime
          required: true
          immutable: false
        - name: installments
          type: integer
          required: true
          immutable: false
          minimum: 1
          maximum: 48
        - name: discount_percent
          type: integer
          required: true
          immutable: false
          minimum: 0
          maximum: 100
        - name: enabled
          type: boolean
          required: true
          immutable: false
  operations:
    - id: CreatePromotion
      title: Crear promoción
      kind: create
      entity: Promotion
      method: POST
      path: /v1/promotions
      emits: PromocionCreada
      correlation:
        promotion_id: id
      parameters: []
    - id: UpdatePromotion
      title: Modificar promoción
      kind: update
      entity: Promotion
      method: PUT
      path: /v1/promotions/{id}
      emits: PromocionActualizada
      correlation:
        promotion_id: id
      parameters: []
    - id: GetPromotion
      title: Consultar promoción
      kind: get
      entity: Promotion
      method: GET
      path: /v1/promotions/{id}
      emits: PromocionConsultada
      correlation:
        promotion_id: id
      parameters: []
    - id: ListPromotions
      title: Listar promociones
      kind: list
      entity: Promotion
      method: GET
      path: /v1/promotions
      emits: CatalogoConsultado
      correlation: {}
      parameters: []
    - id: CheckPromotionValidity
      title: Consultar vigencia
      kind: evaluate_validity
      entity: Promotion
      method: GET
      path: /v1/promotions/{id}/validity
      emits: VigenciaConsultada
      correlation:
        promotion_id: id
      parameters:
        - name: at
          in: query
          type: datetime
          required: true
          description: Instante para el cual se evalúa la vigencia, en formato RFC3339.
  policies:
    - id: PromotionValidity
      kind: active_between
      entity: Promotion
      start_field: starts_at
      end_field: ends_at
      enabled_field: enabled
      inclusive_start: true
      exclusive_end: true
  flows:
    - name: CatalogManagement
      title: Gestión de catálogo
      purpose: Crear y modificar promociones administradas.
      operations:
        - CreatePromotion
        - UpdatePromotion
    - name: AuthorizationSupport
      title: Soporte a autorizaciones
      purpose: Informar vigencia, cuotas y descuento para asistir al equipo autorizador.
      operations:
        - GetPromotion
        - ListPromotions
        - CheckPromotionValidity

proposed_by: Claude (delegado autorizado por marianoceneri, ensayo 6)
rationale: "Incorpora cupones al contrato operacional según las 5 ratificaciones de la negociación sha256:b09a488d. Agrega los eventos CuponEmitido, CuponConsultado y CuponCanjeado y diez reglas. Correlacionadas por coupon_code: CR-018 emisión única por código, CR-020 consulta solo tras emisión, CR-021 canje único, CR-025 canje solo tras emisión. Correlacionadas por promotion_id: CR-019 emisión solo tras publicar (AQ-COUPON-ISSUE-STATE opción 1), CR-026 y CR-027 prohíben emitir tras archivar y entre baja y rehabilitación; CR-022, CR-023 y CR-024 son las reglas de canje ratificadas en AQ-COUPON-REDEEM-GUARD (canje solo tras publicar, prohibido tras archivar, prohibido entre baja y rehabilitación). Estas reglas de traza NO sustituyen la garantía de borde: la propuesta de aplicación las duplica como state_guards via promotion_id, de modo que la restricción se impone en línea y además se verifica sobre la traza. La vigencia temporal del canje queda exigida en el borde por precondition.requires.policy PromotionValidity via promotion_id (AQ-COUPON-VIGENCIA, intención original sin copiar ends_at); las primitivas operacionales siguen sin expresar ventanas de tiempo, por lo que no se agrega ninguna regla de traza que la aproxime. analyze_contract sobre este candidato: consistent, sin eventos muertos, bound 24."

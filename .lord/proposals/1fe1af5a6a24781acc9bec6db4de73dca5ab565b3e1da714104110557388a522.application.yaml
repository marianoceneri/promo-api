version: "0.2"
kind: application_contract
status: proposal
proposal_id: sha256:1fe1af5a6a24781acc9bec6db4de73dca5ab565b3e1da714104110557388a522
source_contract_id: sha256:566bb9fd1216b09c973fb45102375a522df9c0719ecaa3be0b2f7c3350e16afc
proposed_contract_id: sha256:1f90afe930c9ea2e6b5f6dc45f7499b776686d652f6bf779d15bea1efcdd0c2d
proposed_by: Claude (agente), por pedido de marianoceneri
rationale: 'Implementa las 7 decisiones ratificadas en la negociación sha256:057d7d18 usando el estado enumerado que habilita el motor 0.5.0. Campo status (enum draft/published/archived, default draft, immutable) que convive con el booleano enabled (AQ-LIFECYCLE-REPLACE=2): el ciclo editorial y la disponibilidad operativa quedan como dimensiones separadas, y ninguna operación vigente se elimina. El default draft hace que una promoción nazca en borrador cuando el campo se omite (AQ-CREATE-STATE=1); el borde no puede rechazar un alta que envíe un estado explícito distinto, y el respaldo es CR-014 en la traza. PublishPromotion (draft→published) y ArchivePromotion (published→archived) son las únicas vías de cambio de estado; status inmutable impide que la modificación genérica lo escriba (AQ-GENERIC-UPDATE=1) y el estado de origen de cada transición produce el rechazo explícito ante pedidos repetidos (AQ-REPEATED=1). CheckPromotionValidity guarda status=published (AQ-VALIDITY-GUARD=1), lo que excluye en el borde tanto borradores como archivadas. Lecturas de características y listado siguen disponibles sobre archivadas, con filtro tipado por status además del filtro por enabled (AQ-ARCHIVED-READS=1). Dos conjunciones ratificadas no son expresables en el borde porque una operación admite una sola guarda de igualdad sobre un único campo: (a) en UpdatePromotion, "modificable en borrador y publicada, nunca archivada" (AQ-UPDATE-STATE=1) junto con la guarda vigente enabled=true; se conserva enabled=true en el borde y la exclusión de archivadas queda en CR-013; (b) en CheckPromotionValidity, status=published junto con enabled=true; prevalece la ratificación explícita status=published y la exigencia de habilitación queda en la regla vigente CR-008. Ninguna de las dos ratificaciones se debilita: ambas mitades quedan verificadas en la traza. Requiere aprobar también la propuesta operacional sha256:38e479fd, que aporta PromocionPublicada y PromocionArchivada.'

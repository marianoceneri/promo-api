version: "0.2"
kind: application_contract
status: proposal
proposal_id: sha256:41ef73f5fbddea05c59289de4329bf05d30299b6c3537b388c9ad6682e24d19c
source_contract_id: sha256:c434ffd85c23b1193f24005204900bd9369b656f50eb7a35c64eba613c01457e
proposed_contract_id: sha256:d6666803d0fec55c76fb1bae88fb5a0778a35630d307a5e6c1315ef7c0022b96
proposed_by: Claude (delegado autorizado por marianoceneri, ensayo 6)
rationale: "Incorpora cupones al contrato de aplicación honrando las 5 ratificaciones sin bajar ninguna garantía a la traza, usando las capacidades nuevas del motor 0.8.0. Entidad Coupon (sqlite) con code como id_field provisto por el emisor (AQ-COUPON-CODE-ORIGIN opción 1), promotion_id con references a Promotion.id (una sola promoción por cupón, con FK real y rechazo de referencias inexistentes) y status enum issued/redeemed inmutable, para que el canje sea autoritativo por la transición. IssueCoupon (POST /v1/coupons) exige en el borde, vía state_guards con via promotion_id, que la promoción esté publicada y habilitada (AQ-COUPON-ISSUE-STATE opción 1). RedeemCoupon (POST /v1/coupons/{code}/redeem) es transition issued->redeemed, lo que impone el canje único en el borde, con los mismos state_guards via promotion_id (AQ-COUPON-REDEEM-GUARD: la intención ratificada era que la restricción rigiera; con 0.8.0 se impone en línea y ya no queda como brecha) y precondition.requires policy PromotionValidity via promotion_id, que exige la vigencia de la promoción referenciada al instante de la solicitud sin duplicar starts_at/ends_at en el cupón (AQ-COUPON-VIGENCIA: intención original, aproximación por copia descartada e innecesaria). GetCoupon (GET /v1/coupons/{code}) es la única lectura de cupones; no se agrega listado (AQ-COUPON-LIST opción 2). Nuevo flujo CouponManagement para emisión y canje; GetCoupon se incorpora a AuthorizationSupport. Las tres operaciones emiten CuponEmitido, CuponConsultado y CuponCanjeado, correlacionados por coupon_code y promotion_id, que la propuesta operacional sha256:9f6a283b agrega junto a CR-018..CR-027 como verificación de traza redundante con las guardas de borde. validate_application_contract: valid, sha256:d6666803. La alineación figura incomplete solo porque el contrato operacional que declara esos eventos todavía es propuesta: ambas deben aprobarse juntas."
negotiation_id: sha256:b09a488d046bf87611fec064ee429d6e1aa241cdad417cf29241b1b5e2620344
decisions_fingerprint: sha256:67573f817986c0a6ac85a19c9fcd0ffdb9591fbe69781a3776121ea54abb8937
created_at: 2026-08-11T18:34:59.766Z
impact:
  entities_added:
    - Coupon
  entities_removed: []
  entities_modified: []
  operations_added:
    - GetCoupon
    - IssueCoupon
    - RedeemCoupon
  operations_removed: []
  operations_modified: []

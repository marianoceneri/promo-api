version: "0.2"
kind: application_contract
status: proposal
proposal_id: sha256:26b802fecef514bd313c8017f7def50030a809ab4cac15bbe37ec11570ab0501
source_contract_id: sha256:1d64b2472889e32cd56eafaf8b4b15add3eba06f3da241f702103d43033f2b73
proposed_contract_id: sha256:566bb9fd1216b09c973fb45102375a522df9c0719ecaa3be0b2f7c3350e16afc
proposed_by: marianoceneri
rationale: "Deriva de la negociación sha256:4ea982097b9e70c8364e8644c3c13a234ae6249c51d2104bdca691168f30ae05 (4 decisiones ratificadas). El vínculo formal no pudo registrarse porque LORD reporta esa negociación como obsoleta: fue abierta contra el contrato de aplicación sha256:bbdd4111b650fd48fbb3d2b7ea24b6299de2cfd0fb3baa7a5c16bdd460bf9d69 y el activo es sha256:1d64b2472889e32cd56eafaf8b4b15add3eba06f3da241f702103d43033f2b73. Contenido: DisablePromotion (transition enabled true->false, emite PromocionDadaDeBaja) y EnablePromotion (transition false->true, emite PromocionRehabilitada); state_guard enabled=true en UpdatePromotion y CheckPromotionValidity para que una promoción dada de baja solo pueda consultarse; parámetro de consulta enabled en ListPromotions para filtrar por estado. Dos puntos no cubiertos por las decisiones ratificadas se resolvieron de forma conservadora y requieren ratificación del operador antes de aprobar: (1) el campo enabled se marca immutable para que UpdatePromotion no pueda cambiar el estado por fuera de las operaciones dedicadas, que es lo que sostiene la garantía de la baja; (2) EnablePromotion conserva la precondición ends_at at_or_after request_time para no habilitar un camino que rehabilite promociones vencidas, eludiendo la regla activa del commit e583a5f."
created_at: 2026-08-11T14:48:40.848Z
impact:
  entities_added: []
  entities_removed: []
  entities_modified:
    - Promotion
  operations_added:
    - DisablePromotion
    - EnablePromotion
  operations_removed: []
  operations_modified:
    - CheckPromotionValidity
    - ListPromotions
    - UpdatePromotion
  policies_added: []
  policies_removed: []
  flows_added: []
  flows_removed: []
contract:
  version: "0.2"
  name: promo-api
  target:
    kind: go-rest
    module: github.com/marianoceneri/promo-api
    port: 8080
  entities:
    - name: Promotion
      title: promoción
      plural: promotions
      id_field: id
      storage: memory
      fields:
        - name: id
          type: string
          required: true
          immutable: true
        - name: name
          type: string
          required: true
          immutable: false
        - name: starts_at
          type: datetime
          required: true
          immutable: false
        - name: ends_at
          type: datetime
          required: true
          immutable: false
        - name: installments
          type: integer
          required: true
          immutable: false
          minimum: 1
          maximum: 48
        - name: discount_percent
          type: integer
          required: true
          immutable: false
          minimum: 0
          maximum: 100
        - name: enabled
          type: boolean
          required: true
          immutable: true
  operations:
    - id: CreatePromotion
      title: Crear promoción
      kind: create
      entity: Promotion
      method: POST
      path: /v1/promotions
      emits: PromocionCreada
      correlation:
        promotion_id: id
      parameters: []
      precondition:
        when:
          field: enabled
          equals: true
        requires:
          field: ends_at
          at_or_after: request_time
    - id: UpdatePromotion
      title: Modificar promoción
      kind: update
      entity: Promotion
      method: PUT
      path: /v1/promotions/{id}
      emits: PromocionActualizada
      correlation:
        promotion_id: id
      parameters: []
      state_guard:
        field: enabled
        equals: true
      precondition:
        when:
          field: enabled
          equals: true
        requires:
          field: ends_at
          at_or_after: request_time
    - id: DisablePromotion
      title: Dar de baja promoción
      kind: transition
      entity: Promotion
      method: POST
      path: /v1/promotions/{id}/disable
      emits: PromocionDadaDeBaja
      correlation:
        promotion_id: id
      parameters: []
      transition:
        field: enabled
        from: true
        to: false
    - id: EnablePromotion
      title: Rehabilitar promoción
      kind: transition
      entity: Promotion
      method: POST
      path: /v1/promotions/{id}/enable
      emits: PromocionRehabilitada
      correlation:
        promotion_id: id
      parameters: []
      transition:
        field: enabled
        from: false
        to: true
      precondition:
        when:
          field: enabled
          equals: true
        requires:
          field: ends_at
          at_or_after: request_time
    - id: GetPromotion
      title: Consultar promoción
      kind: get
      entity: Promotion
      method: GET
      path: /v1/promotions/{id}
      emits: PromocionConsultada
      correlation:
        promotion_id: id
      parameters: []
    - id: ListPromotions
      title: Listar promociones
      kind: list
      entity: Promotion
      method: GET
      path: /v1/promotions
      emits: CatalogoConsultado
      correlation: {}
      parameters:
        - name: enabled
          in: query
          type: boolean
          required: false
          field: enabled
          description: Filtra el listado por estado de habilitación de la promoción.
    - id: CheckPromotionValidity
      title: Consultar vigencia
      kind: evaluate_validity
      entity: Promotion
      method: GET
      path: /v1/promotions/{id}/validity
      emits: VigenciaConsultada
      correlation:
        promotion_id: id
      parameters:
        - name: at
          in: query
          type: datetime
          required: true
          description: Instante para el cual se evalúa la vigencia, en formato RFC3339.
      state_guard:
        field: enabled
        equals: true
  policies:
    - id: PromotionValidity
      kind: active_between
      entity: Promotion
      start_field: starts_at
      end_field: ends_at
      enabled_field: enabled
      inclusive_start: true
      exclusive_end: true
  flows:
    - name: CatalogManagement
      title: Gestión de catálogo
      purpose: Crear, modificar, dar de baja y rehabilitar promociones administradas.
      operations:
        - CreatePromotion
        - UpdatePromotion
        - DisablePromotion
        - EnablePromotion
    - name: AuthorizationSupport
      title: Soporte a autorizaciones
      purpose: Informar vigencia, cuotas y descuento para asistir al equipo autorizador.
      operations:
        - GetPromotion
        - ListPromotions
        - CheckPromotionValidity

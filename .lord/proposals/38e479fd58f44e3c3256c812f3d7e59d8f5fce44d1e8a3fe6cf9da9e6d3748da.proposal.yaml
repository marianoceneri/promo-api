proposed_by: Claude (agente), por pedido de marianoceneri
rationale: 'Deriva el ciclo de vida editorial explícito (borrador→publicada→archivada, archivado definitivo) de las 7 decisiones ratificadas en la negociación sha256:057d7d18. Incorpora los eventos PromocionPublicada y PromocionArchivada sin quitar ni modificar ninguna regla vigente: la baja y la rehabilitación conviven (AQ-LIFECYCLE-REPLACE=2) y CR-001..CR-008 quedan intactas. CR-009/CR-010 fijan que publicar exige creación previa y ocurre una sola vez (AQ-REPEATED=1, sin retorno a borrador). CR-011/CR-012 fijan que archivar exige publicación previa y es definitivo. CR-013 y CR-015 sostienen en la traza las dos mitades que la guarda de borde no puede expresar: la prohibición de modificar una promoción archivada (AQ-UPDATE-STATE=1, cuya condición "distinta de archivada" no es una igualdad contra un único valor) y la exclusión de las archivadas del soporte a autorizaciones. CR-014 exige publicación previa para evaluar vigencia (AQ-VALIDITY-GUARD=1). CR-016/CR-017 traducen el racional ratificado de que "el archivado es definitivo y prevalece" sobre la dimensión de disponibilidad operativa; son la lectura del agente de ese racional y quedan sujetas a confirmación explícita del operador al aprobar. Análisis Z3 con bound 18: consistente, sin eventos muertos.'

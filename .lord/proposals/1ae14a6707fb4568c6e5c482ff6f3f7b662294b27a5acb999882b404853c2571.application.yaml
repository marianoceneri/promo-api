version: "0.2"
kind: application_contract
status: proposal
proposal_id: sha256:1ae14a6707fb4568c6e5c482ff6f3f7b662294b27a5acb999882b404853c2571
source_contract_id: sha256:2bd8d79332dc900aa6d84172624104c006fecf4aaaeffb750c1d676bdbb9eee2
proposed_contract_id: sha256:c434ffd85c23b1193f24005204900bd9369b656f50eb7a35c64eba613c01457e
proposed_by: Claude (asistente); decisiones ratificadas por marianoceneri
rationale: "Persistencia real en disco para el catálogo de promociones, según las dos decisiones ratificadas en la negociación sha256:d154405f (AQ-STORAGE-BACKEND=1 SQLite embebido, AQ-DATABASE-PATH=1 ./data/promotions.db). La entidad Promotion pasa de storage: memory a storage: sqlite y el target declara database: {kind: sqlite, path: ./data/promotions.db}, sobrescribible en despliegue con LORD_DATABASE_PATH. El catálogo sobrevive reinicios y caídas del servicio. No se altera ninguna entidad, campo, operación, política ni flujo: el comportamiento de negocio ya aprobado queda intacto y la alineación con el contrato operacional se mantiene. Limitación conocida y aceptada: un único proceso escritor sobre un volumen persistente; no habilita varias instancias compartiendo catálogo ni alta disponibilidad."
negotiation_id: sha256:d154405fec406946954267da3a401d1643da179ff189cd87ce9ed5f9eff4c61e
decisions_fingerprint: sha256:dca6310930619e4ae9acae6d1bf333855e9fe6916f48502ba797a27193a7becb
created_at: 2026-08-11T15:58:50.915Z

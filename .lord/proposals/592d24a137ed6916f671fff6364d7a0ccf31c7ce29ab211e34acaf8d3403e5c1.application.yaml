version: "0.2"
kind: application_contract
status: proposal
proposal_id: sha256:592d24a137ed6916f671fff6364d7a0ccf31c7ce29ab211e34acaf8d3403e5c1
source_contract_id: sha256:bbdd4111b650fd48fbb3d2b7ea24b6299de2cfd0fb3baa7a5c16bdd460bf9d69
proposed_contract_id: sha256:1d64b2472889e32cd56eafaf8b4b15add3eba06f3da241f702103d43033f2b73
proposed_by: "marianoceneri (delegado autorizado: Claude)"
rationale: "Impide habilitar una promoción vencida, según las cuatro decisiones ratificadas en la negociación sha256:177415b0…cee42. AQ-VENCIDA-ALCANCE (choice 2): la precondición se agrega tanto a CreatePromotion como a UpdatePromotion, de modo que ninguna escritura del catálogo pueda dejar enabled=true con ends_at vencido. AQ-VENCIDA-REFERENCIA (choice 1): el instante de referencia es el reloj del servicio al ejecutar la operación (requires.at_or_after: request_time); es una garantía de borde de la API y no una regla de traza reproducible, por lo que no se propone cambio en el contrato operacional. AQ-VENCIDA-LIMITE (choice 2): el rechazo ocurre sólo si ends_at es estrictamente anterior al instante de referencia; ends_at igual al instante sigue siendo habilitable, criterio de borde deliberadamente distinto del fin exclusivo de PromotionValidity. AQ-VENCIDA-EXISTENTE (choice 1): la regla sólo prohíbe el acto de escribir enabled=true con vigencia vencida; no se deshabilita nada automáticamente, no hay efecto retroactivo sobre promociones ya habilitadas y ends_at no queda inmutable. La cláusula when {enabled=true} deja intacta cualquier escritura con enabled=false. La vigencia efectiva se sigue informando por CheckPromotionValidity."
negotiation_id: sha256:177415b02c1a575024e922e7e16fc25c6b36f407d0f2849c2287fcccd12cee42
decisions_fingerprint: sha256:e168808e284281de6e5ac208b98cab73c3337641d774ad86dfc0b787fcaa77d0
created_at: 2026-08-11T14:32:59.361Z
impact:

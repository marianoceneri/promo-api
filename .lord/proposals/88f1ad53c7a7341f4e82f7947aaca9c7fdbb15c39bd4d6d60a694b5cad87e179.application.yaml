version: "0.2"
kind: application_contract
status: proposal
proposal_id: sha256:88f1ad53c7a7341f4e82f7947aaca9c7fdbb15c39bd4d6d60a694b5cad87e179
source_contract_id: sha256:566bb9fd1216b09c973fb45102375a522df9c0719ecaa3be0b2f7c3350e16afc
proposed_contract_id: sha256:2bd8d79332dc900aa6d84172624104c006fecf4aaaeffb750c1d676bdbb9eee2
proposed_by: Claude (agente), por pedido de marianoceneri
rationale: 'Reemplaza la propuesta rechazada sha256:1fe1af5a, que dividía dos garantías ratificadas entre el borde y la traza. Con las guardas compuestas del motor 0.6.0 ninguna ratificación se degrada: toda condición ratificada se rechaza con 409 en el borde. CheckPromotionValidity exige la conjunción status=published Y enabled=true, de modo que borradores, archivadas y publicadas dadas de baja quedan fuera del soporte a autorizaciones en el borde, sin regresión respecto del comportamiento vigente (AQ-VALIDITY-GUARD=1 más la ratificación previa de la negociación 47b30914). UpdatePromotion exige enabled=true Y status en [draft, published]: la guarda de pertenencia expresa directamente "nunca archivada" (AQ-UPDATE-STATE=1) sin depender de CR-013. DisablePromotion y EnablePromotion incorporan la misma guarda de pertenencia para que CR-016 y CR-017, ya aprobadas como contrato operacional activo sha256:7b2a2ff0, se enforceen también en el borde en lugar de quedar como verificación posterior. El resto sigue las decisiones ratificadas: convivencia de ambas dimensiones sin quitar operaciones (AQ-LIFECYCLE-REPLACE=2); status enum con default draft para que la promoción nazca en borrador (AQ-CREATE-STATE=1); status inmutable para que la modificación genérica no lo escriba (AQ-GENERIC-UPDATE=1); estado de origen de cada transición para el rechazo explícito ante pedidos repetidos (AQ-REPEATED=1); consulta de características y listado disponibles sobre archivadas con filtro tipado por status (AQ-ARCHIVED-READS=1). Alineación operacional: aligned contra el contrato activo sha256:7b2a2ff0. Única limitación subsistente: el default draft cubre la omisión del campo, pero un alta que envíe status explícito distinto no puede rechazarse en el borde; el respaldo es CR-009/CR-014.'
negotiation_id: sha256:057d7d18bf332caa3810501b75bbb1515203f9c7fc0d04f8a53ab4742bb69969

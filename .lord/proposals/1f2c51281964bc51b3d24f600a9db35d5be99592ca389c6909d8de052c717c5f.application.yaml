version: "0.2"
kind: application_contract
status: proposal
proposal_id: sha256:1f2c51281964bc51b3d24f600a9db35d5be99592ca389c6909d8de052c717c5f
source_contract_id: sha256:1d64b2472889e32cd56eafaf8b4b15add3eba06f3da241f702103d43033f2b73
proposed_contract_id: sha256:566bb9fd1216b09c973fb45102375a522df9c0719ecaa3be0b2f7c3350e16afc
proposed_by: marianoceneri
rationale: "Incorpora la baja de promociones como capacidad explícita del catálogo, fiel a las 6 decisiones ratificadas en la negociación sha256:47b30914… AQ-BAJA-NATURALEZA=1: baja lógica mediante DisablePromotion (transition enabled true->false, emite PromocionDadaDeBaja). AQ-BAJA-REALTA=2: rehabilitación mediante EnablePromotion (transition false->true, emite PromocionRehabilitada). AQ-BAJA-EFECTO=3: state_guard enabled=true en UpdatePromotion y CheckPromotionValidity, de modo que una promoción dada de baja solo pueda consultarse; la evaluación de vigencia pasa a rechazarse con 409, cambio observable confirmado por el operador. AQ-BAJA-VISIBILIDAD=2: ListPromotions incorpora el parámetro de consulta booleano opcional enabled, mapeado al campo homónimo. AQ-BAJA-BYPASS=1: el campo enabled pasa a immutable para que solo las transiciones dedicadas cambien el estado, preservando la emisión de eventos y el sujeto de CR-006, CR-007 y CR-008. AQ-BAJA-VENCIDA=1: EnablePromotion lleva la misma precondición temporal que Create/Update (ends_at at_or_after request_time), de modo que ningún camino de escritura deje enabled=true con vigencia vencida. Alineación con el contrato operacional activo sha256:1fb3d8fa…: aligned."
negotiation_id: sha256:47b309141561a103fac4e78c81c710befc6ccf087e3059c3bf5e39f533288970
decisions_fingerprint: sha256:97657eb3f2be4d3ba25d54a8a04448895db01aab39a7e56974f46949dcc5bbac
created_at: 2026-08-11T14:52:12.529Z
impact:

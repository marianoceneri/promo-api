contract:
  version: "0.2"
  name: promo-api
  target:
    kind: go-rest
    module: github.com/marianoceneri/promo-api
    port: 8080
  entities:
    - name: Promotion
      title: promoción
      plural: promotions
      id_field: id
      storage: memory
      fields:
        - name: id
          type: string
          required: true
          immutable: true
        - name: name
          type: string
          required: true
          immutable: false
        - name: starts_at
          type: datetime
          required: true
          immutable: false
        - name: ends_at
          type: datetime
          required: true
          immutable: false
        - name: installments
          type: integer
          required: true
          immutable: false
          minimum: 1
          maximum: 48
        - name: discount_percent
          type: integer
          required: true
          immutable: false
          minimum: 0
          maximum: 100
        - name: enabled
          type: boolean
          required: true
          immutable: true
  operations:
    - id: CreatePromotion
      title: Crear promoción
      kind: create
      entity: Promotion
      method: POST
      path: /v1/promotions
      emits: PromocionCreada
      correlation:
        promotion_id: id
      parameters: []
      precondition:
        when:
          field: enabled
          equals: true
        requires:
          field: ends_at
          at_or_after: request_time
    - id: UpdatePromotion
      title: Modificar promoción
      kind: update
      entity: Promotion
      method: PUT
      path: /v1/promotions/{id}
      emits: PromocionActualizada
      correlation:
        promotion_id: id
      parameters: []
      state_guard:
        field: enabled
        equals: true
      precondition:
        when:
          field: enabled
          equals: true
        requires:
          field: ends_at
          at_or_after: request_time
    - id: DisablePromotion
      title: Dar de baja promoción
      kind: transition
      entity: Promotion
      method: POST
      path: /v1/promotions/{id}/disable
      emits: PromocionDadaDeBaja
      correlation:
        promotion_id: id
      parameters: []
      transition:
        field: enabled
        from: true
        to: false
    - id: EnablePromotion
      title: Rehabilitar promoción
      kind: transition
      entity: Promotion
      method: POST
      path: /v1/promotions/{id}/enable
      emits: PromocionRehabilitada
      correlation:
        promotion_id: id
      parameters: []
      transition:
        field: enabled
        from: false
        to: true
      precondition:
        when:
          field: enabled
          equals: true
        requires:
          field: ends_at
          at_or_after: request_time
    - id: GetPromotion
      title: Consultar promoción
      kind: get
      entity: Promotion
      method: GET
      path: /v1/promotions/{id}
      emits: PromocionConsultada
      correlation:
        promotion_id: id
      parameters: []
    - id: ListPromotions
      title: Listar promociones
      kind: list
      entity: Promotion
      method: GET
      path: /v1/promotions
      emits: CatalogoConsultado
      correlation: {}
      parameters:
        - name: enabled
          in: query
          type: boolean
          required: false
          field: enabled
          description: Filtra el listado por estado de habilitación de la promoción.
    - id: CheckPromotionValidity
      title: Consultar vigencia
      kind: evaluate_validity
      entity: Promotion
      method: GET
      path: /v1/promotions/{id}/validity
      emits: VigenciaConsultada
      correlation:
        promotion_id: id
      parameters:
        - name: at
          in: query
          type: datetime
          required: true
          description: Instante para el cual se evalúa la vigencia, en formato RFC3339.
      state_guard:
        field: enabled
        equals: true
  policies:
    - id: PromotionValidity
      kind: active_between
      entity: Promotion
      start_field: starts_at
      end_field: ends_at
      enabled_field: enabled
      inclusive_start: true
      exclusive_end: true
  flows:
    - name: CatalogManagement
      title: Gestión de catálogo
      purpose: Crear, modificar, dar de baja y rehabilitar promociones administradas.
      operations:
        - CreatePromotion
        - UpdatePromotion
        - DisablePromotion
        - EnablePromotion
    - name: AuthorizationSupport
      title: Soporte a autorizaciones
      purpose: Informar vigencia, cuotas y descuento para asistir al equipo autorizador.
      operations:
        - GetPromotion
        - ListPromotions
        - CheckPromotionValidity

    revision: 1
    question: Should CarritoPresentadoParaEvaluacion be a first-class event in this domain contract?
    selected_choice: 1
    selected_answer: Keep it as a first-class domain event.
    consequence: Candidate rules may use CarritoPresentadoParaEvaluacion after operator ratification.
    rationale: Decisión base para evaluar el prototipo de LORD con encuadre explícito

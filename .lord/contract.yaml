version: "0.1"
name: promotion-management-operational-contract
vocabulary:
  events:
    - PromocionCreada
    - PromocionActualizada
    - PromocionConsultada
    - CatalogoConsultado
    - VigenciaConsultada
    - PromocionDadaDeBaja
    - PromocionRehabilitada
rules:
  - id: CR-001
    description: Una promoción solo puede incorporarse una vez al catálogo por identificador.
    correlate_by:
      - promotion_id
    kind: unique
    event: PromocionCreada
  - id: CR-002
    description: Una promoción solo puede modificarse después de haber sido creada.
    correlate_by:
      - promotion_id
    kind: only_after
    event: PromocionActualizada
    required: PromocionCreada
  - id: CR-003
    description: Las características de una promoción solo pueden consultarse después de incorporarla al catálogo.
    correlate_by:
      - promotion_id
    kind: only_after
    event: PromocionConsultada
    required: PromocionCreada
  - id: CR-004
    description: La vigencia de una promoción solo puede evaluarse después de incorporarla al catálogo.
    correlate_by:
      - promotion_id
    kind: only_after
    event: VigenciaConsultada
    required: PromocionCreada
  - id: CR-005
    description: Una promoción solo puede darse de baja después de haber sido incorporada al catálogo.
    correlate_by:
      - promotion_id
    kind: only_after
    event: PromocionDadaDeBaja
    required: PromocionCreada
  - id: CR-006
    description: Baja y rehabilitación de una promoción deben alternar, comenzando por la baja.
    correlate_by:
      - promotion_id
    kind: alternates
    trigger: PromocionDadaDeBaja
    target: PromocionRehabilitada
  - id: CR-007
    description: Una promoción dada de baja no puede modificarse hasta que sea rehabilitada.
    correlate_by:
      - promotion_id
    kind: prohibits_between
    trigger: PromocionDadaDeBaja
    target: PromocionRehabilitada
    prohibited: PromocionActualizada
  - id: CR-008
    description: La vigencia de una promoción dada de baja no puede evaluarse hasta que sea rehabilitada.
    correlate_by:
      - promotion_id
    kind: prohibits_between
    trigger: PromocionDadaDeBaja
    target: PromocionRehabilitada
    prohibited: VigenciaConsultada

rationale: "Cotización de carritos como computación gobernada: formas del carrito y del resultado, cuatro invariantes verificados en cada respuesta (descuento no negativo, topado por el subtotal, total consistente y desglose que suma) y los tres ejemplos ratificados por el operador con su catálogo declarado. El algoritmo de selección y acumulación queda fuera de la generación, como corresponde: LORD verifica que la cuenta cierre, no qué combinación es la mejor."

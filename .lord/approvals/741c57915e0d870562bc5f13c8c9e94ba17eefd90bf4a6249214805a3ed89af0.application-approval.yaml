rationale: "Entidad Coupon con code como identificador provisto por el emisor, promotion_id inmutable con references a Promotion (FK real y rechazo de referencia inexistente), y canje único por transición issued→redeemed. Honra TODAS las ratificaciones en el borde: IssueCoupon y RedeemCoupon exigen vía promotion_id que la promoción esté publicada y habilitada, y el canje exige además PromotionValidity sobre la promoción referenciada, sin duplicar ends_at. Ninguna garantía baja a la traza."

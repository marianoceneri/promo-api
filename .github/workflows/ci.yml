name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

      - name: Check out LORD authority
        uses: actions/checkout@v7
        with:
          repository: marianoceneri/lord
          path: .ci/lord

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .ci/lord/package-lock.json

      - name: Build LORD
        working-directory: .ci/lord
        run: npm ci && npm run build

      - name: Verify contracts, approvals and generated sources
        run: node .ci/lord/dist/cli.js check --project "$GITHUB_WORKSPACE" --json
